name: Deploy Backend Stage

on:
  push:
    branches:
      - stage

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # STEP 1: FILE TRANSFER (FTP)
      # This handles exclusions so you don't upload massive folders.
      - name: Deploy files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: ${{ secrets.FTP_SERVER_STAGE }}
          username: ${{ secrets.FTP_USERNAME_STAGE }}
          password: ${{ secrets.FTP_PASSWORD_STAGE }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: /domains/demohandler.in/public_html/company-backend/
          dangerous-clean-remote: false
          exclude: |
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env*
            **/images/**
            **/public/images/**
            **/storage/*.key
            **/storage/app/**
            **/storage/framework/**
            **/storage/logs/**
            **/bootstrap/cache/**
            **/vendor/**

      # STEP 2: RUN COMMANDS (SSH)
      # This logs into the server terminal to install packages and generate keys.
      - name: Run Artisan Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_STAGE }}
          username: ${{ secrets.SSH_USERNAME_STAGE }}
          password: ${{ secrets.SSH_PASSWORD_STAGE }}
          port: 22 
          script: |
            cd /domains/demohandler.in/public_html/company-backend/

            # ==========================================
            # OPTION 1: FIRST TIME SETUP
            # ==========================================
            cp .env.example .env
            composer install --optimize-autoloader --no-dev
            php artisan key:generate
            php artisan storage:link

            # ==========================================
            # OPTION 2: ROUTINE DEPLOYMENTS (COMMENTED OUT FOR NOW)
            # ==========================================
            # php artisan down || true
            # composer install --optimize-autoloader --no-dev
            # php artisan migrate --force
            # php artisan optimize:clear
            # php artisan config:cache
            # php artisan route:cache
            # php artisan view:cache
            # php artisan up